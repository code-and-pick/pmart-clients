name: customer_app
description: PMart 고객 앱
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.13.4
  flutter: ">=3.47.5"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  dio: ^5.11.1
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.1
  intl: ^0.20.3
  pmart_core:
    path: ../../packages/pmart_core
  pmart_ui:
    path: ../../packages/pmart_ui
  pmart_api_cart:
    path: ../../packages/pmart_api/gen/cart
  pmart_api_auth:
    path: ../../packages/pmart_api/gen/auth
  pmart_api_product:
    path: ../../packages/pmart_api/gen/product
  pmart_api_product_content:
    path: ../../packages/pmart_api/gen/product-content
  pmart_api_pricing:
    path: ../../packages/pmart_api/gen/pricing
  pmart_api_search:
    path: ../../packages/pmart_api/gen/search
  pmart_api_storefront:
    path: ../../packages/pmart_api/gen/storefront
  pmart_api_customer:
    path: ../../packages/pmart_api/gen/customer
  pmart_api_order:
    path: ../../packages/pmart_api/gen/order
  pmart_api_payment:
    path: ../../packages/pmart_api/gen/payment
  pmart_api_delivery_capacity:
    path: ../../packages/pmart_api/gen/delivery-capacity
  pmart_api_delivery_serviceability:
    path: ../../packages/pmart_api/gen/delivery-serviceability
  pmart_api_delivery_tracking:
    path: ../../packages/pmart_api/gen/delivery-tracking
  pmart_api_claim:
    path: ../../packages/pmart_api/gen/claim
  pmart_api_notification:
    path: ../../packages/pmart_api/gen/notification
  pmart_api_review:
    path: ../../packages/pmart_api/gen/review
  pmart_api_case:
    path: ../../packages/pmart_api/gen/case
  pmart_api_order_orchestration:
    path: ../../packages/pmart_api/gen/order-orchestration
  pmart_api_customer_assistant:
    path: ../../packages/pmart_api/gen/customer-assistant
  google_sign_in: ^7.2.0
  tosspayments_widget_sdk_flutter: ^2.3.0
  kakao_map_sdk: ^1.3.1
  # 주소 검색(다음 우편번호) 웹 화면. 토스 결제위젯 SDK 가 이미 쓰는 웹뷰라 같은 것을 쓴다(루트 override 6.2.0-beta.3).
  flutter_inappwebview: ^6.1.5
  # 리뷰 사진 고르기(사진첩·카메라) — review 0.2.0 `POST /review-photos`. Flutter 팀 공식 플러그인(사용자 2026-11-16).
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  # Pretendard (SIL OFL 1.1, assets/fonts/Pretendard-LICENSE.txt). 사용자 지시 2026-11-11.
  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.otf
          weight: 400
        - asset: assets/fonts/Pretendard-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Pretendard-Bold.otf
          weight: 700
        - asset: assets/fonts/Pretendard-ExtraBold.otf
          weight: 800
